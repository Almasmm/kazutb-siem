name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kcsp_test
          POSTGRES_USER: kcsp
          POSTGRES_PASSWORD: kcsp-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kcsp -d kcsp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KCSP_TEST_DATABASE_URL: postgres://kcsp:kcsp-ci-only@127.0.0.1:5432/kcsp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit and boundary tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
