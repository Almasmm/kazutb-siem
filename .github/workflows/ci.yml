name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kcsp_test
          POSTGRES_USER: kcsp
          POSTGRES_PASSWORD: kcsp-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kcsp -d kcsp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine
        env:
          CLICKHOUSE_DB: kcsp_test
          CLICKHOUSE_USER: kcsp
          CLICKHOUSE_PASSWORD: kcsp-ci-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user kcsp --password kcsp-ci-only --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      kafka:
        image: apache/kafka:4.1.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
      valkey:
        image: valkey/valkey:8.1.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      KCSP_TEST_DATABASE_URL: postgres://kcsp:kcsp-ci-only@127.0.0.1:5432/kcsp_test?sslmode=disable
      KCSP_TEST_CLICKHOUSE_URL: clickhouse://kcsp:kcsp-ci-only@127.0.0.1:9000/kcsp_test
      KCSP_TEST_KAFKA_BROKERS: 127.0.0.1:9092
      KCSP_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit and boundary tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build Windows lightweight agent
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/kcsp-agent.exe ./cmd/agent
      - name: Validate Windows deployment and 2000-host rollout contracts
        shell: pwsh
        run: ./ops/agent/windows/Self-Test.ps1 -PrebuiltBinary /tmp/kcsp-agent.exe
      - name: Validate signed multi-platform agent release
        run: bash ops/agent/release-self-test.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  disaster-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build version-pinned DR image
        run: docker build --file Dockerfile.dr --tag kcsp-dr:ci .
      - name: Build PostgreSQL PITR image
        run: docker build --file Dockerfile.postgres --tag kcsp-postgres:17 --tag kcsp-postgres:ci .
      - name: Build PostgreSQL HA image
        run: docker build --file Dockerfile.patroni --tag kcsp-patroni:ci .
      - name: Build PostgreSQL HA router
        run: docker build --file Dockerfile.haproxy --tag kcsp-postgres-ha-router:ci .
      - name: Build local PITR TLS proxy
        run: docker build --file Dockerfile.pitr-proxy --tag kcsp-pitr-proxy:ci .
      - name: Run DR integrity and archive self-test
        run: docker run --rm kcsp-dr:ci self-test
      - name: Run pgBackRest fail-closed configuration self-test
        run: docker run --rm --entrypoint /usr/local/bin/kcsp-pgbackrest-self-test kcsp-postgres:ci
      - name: Run Patroni quorum configuration self-test
        run: docker run --rm --entrypoint /usr/local/bin/kcsp-patroni-self-test kcsp-patroni:ci
      - name: Validate Compose profiles
        env:
          KCSP_POSTGRES_PASSWORD: kcsp-ci-only
          KCSP_CLICKHOUSE_PASSWORD: kcsp-ci-only
          KCSP_MINIO_ROOT_USER: kcsp-ci-only
          KCSP_MINIO_ROOT_PASSWORD: kcsp-ci-only-secret
          KCSP_GRAFANA_ADMIN_PASSWORD: kcsp-ci-only
          KCSP_VALKEY_PASSWORD: kcsp-valkey-ci-only
          KCSP_DR_TARGET_ACCESS_KEY: kcsp-dr-ci-only
          KCSP_DR_TARGET_SECRET_KEY: kcsp-dr-ci-only-secret
          KCSP_DR_TARGET_ALLOW_INSECURE: "true"
          KCSP_DR_MANIFEST_HMAC_KEY: kcsp-dr-ci-only-signing-key-32-bytes
          KCSP_PITR_S3_ENDPOINT: pitr-s3-proxy
          KCSP_PITR_S3_PORT: 9443
          KCSP_PITR_TLS_VERIFY: "n"
          KCSP_PITR_S3_ACCESS_KEY: kcsp-pitr-ci-only
          KCSP_PITR_S3_SECRET_KEY: kcsp-pitr-ci-only-secret
          KCSP_PITR_REPO_CIPHER_PASS: kcsp-pitr-ci-only-cipher-passphrase
          KCSP_HA_POSTGRES_PASSWORD: kcsp-ha-ci-superuser-password
          KCSP_HA_REPLICATION_PASSWORD: kcsp-ha-ci-replication-password
          KCSP_HA_REWIND_PASSWORD: kcsp-ha-ci-rewind-password
        run: docker compose --profile dr --profile dr-scheduled --profile pitr --profile ha config --quiet
