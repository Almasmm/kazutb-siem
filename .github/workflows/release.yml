name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      KCSP_COSIGN_IMAGE: ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
      KCSP_RELEASE_VERSION: ${{ github.ref_name }}
      KCSP_RELEASE_OUTPUT_DIR: /tmp/kcsp-release
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to GHCR
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build, attest, and keyless-sign immutable images
        run: bash ops/supply-chain/release.sh

      - name: Publish signed release manifest
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              /tmp/kcsp-release/kcsp-release-manifest.json \
              /tmp/kcsp-release/kcsp-release-manifest.sha256 \
              /tmp/kcsp-release/kcsp-release-manifest.sigstore.json \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              /tmp/kcsp-release/kcsp-release-manifest.json \
              /tmp/kcsp-release/kcsp-release-manifest.sha256 \
              /tmp/kcsp-release/kcsp-release-manifest.sigstore.json \
              --verify-tag \
              --title "KCSP $GITHUB_REF_NAME" \
              --generate-notes
          fi
