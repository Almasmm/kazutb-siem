name: kcsp

x-patroni-environment: &patroni-environment
  KCSP_PATRONI_SCOPE: kcsp-ha
  KCSP_PATRONI_ETCD3_HOSTS: etcd-1:2379,etcd-2:2379,etcd-3:2379
  KCSP_PATRONI_TTL_SECONDS: 30
  KCSP_PATRONI_LOOP_WAIT_SECONDS: 5
  KCSP_PATRONI_RETRY_TIMEOUT_SECONDS: 10
  KCSP_PATRONI_MAXIMUM_LAG_BYTES: 1048576
  KCSP_PATRONI_SYNCHRONOUS_NODES: 1
  KCSP_PATRONI_WATCHDOG_MODE: automatic
  KCSP_HA_DATABASE: kcsp
  KCSP_HA_SUPERUSER: kcsp
  KCSP_HA_REPLICATION_USER: kcsp_replicator
  KCSP_HA_REWIND_USER: kcsp_rewind
  KCSP_HA_POSTGRES_PASSWORD: ${KCSP_HA_POSTGRES_PASSWORD:-}
  KCSP_HA_REPLICATION_PASSWORD: ${KCSP_HA_REPLICATION_PASSWORD:-}
  KCSP_HA_REWIND_PASSWORD: ${KCSP_HA_REWIND_PASSWORD:-}
  PATRONI_CONFIG_FILE: /tmp/patroni.yml

x-patroni-dependencies: &patroni-dependencies
  etcd-1:
    condition: service_healthy
  etcd-2:
    condition: service_healthy
  etcd-3:
    condition: service_healthy

services:
  postgres:
    image: kcsp-postgres:17
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: kcsp
      POSTGRES_USER: kcsp
      POSTGRES_PASSWORD: ${KCSP_POSTGRES_PASSWORD:?Set KCSP_POSTGRES_PASSWORD in .env}
      KCSP_PITR_ENABLED: ${KCSP_PITR_ENABLED:-false}
      KCSP_PITR_SCHEDULER_ENABLED: ${KCSP_PITR_SCHEDULER_ENABLED:-true}
      KCSP_PITR_STANZA: kcsp
      KCSP_PITR_S3_ENDPOINT: ${KCSP_PITR_S3_ENDPOINT:-}
      KCSP_PITR_S3_PORT: ${KCSP_PITR_S3_PORT:-443}
      KCSP_PITR_S3_BUCKET: ${KCSP_PITR_S3_BUCKET:-kcsp-dr}
      KCSP_PITR_S3_REGION: ${KCSP_PITR_S3_REGION:-us-east-1}
      KCSP_PITR_TLS_VERIFY: ${KCSP_PITR_TLS_VERIFY:-y}
      KCSP_PITR_REPO_PATH: ${KCSP_PITR_REPO_PATH:-/pgbackrest}
      KCSP_PITR_ARCHIVE_TIMEOUT_SECONDS: ${KCSP_PITR_ARCHIVE_TIMEOUT_SECONDS:-60}
      KCSP_PITR_RPO_SECONDS: ${KCSP_PITR_RPO_SECONDS:-300}
      KCSP_PITR_SCHEDULE_SECONDS: ${KCSP_PITR_SCHEDULE_SECONDS:-21600}
      KCSP_PITR_FULL_INTERVAL_SECONDS: ${KCSP_PITR_FULL_INTERVAL_SECONDS:-604800}
      KCSP_PITR_RETENTION_FULL: ${KCSP_PITR_RETENTION_FULL:-7}
      KCSP_PITR_RETENTION_DIFF: ${KCSP_PITR_RETENTION_DIFF:-14}
      PGBACKREST_REPO1_S3_KEY: ${KCSP_PITR_S3_ACCESS_KEY:-}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${KCSP_PITR_S3_SECRET_KEY:-}
      PGBACKREST_REPO1_CIPHER_PASS: ${KCSP_PITR_REPO_CIPHER_PASS:-}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcsp -d kcsp"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - kcsp-postgres-data:/var/lib/postgresql/data
      - kcsp-pgbackrest-state:/var/lib/pgbackrest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - kcsp-kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: kcsp
      CLICKHOUSE_USER: kcsp
      CLICKHOUSE_PASSWORD: ${KCSP_CLICKHOUSE_PASSWORD:?Set KCSP_CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - kcsp-clickhouse-data:/var/lib/clickhouse
      - kcsp-clickhouse-logs:/var/log/clickhouse-server
      - kcsp-clickhouse-backups:/var/lib/clickhouse/backups
      - ./deploy/clickhouse/config.d/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${KCSP_MINIO_ROOT_USER:?Set KCSP_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${KCSP_MINIO_ROOT_PASSWORD:?Set KCSP_MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - kcsp-minio-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      KCSP_LISTEN_ADDR: ":8080"
      KCSP_PROFILE: development
      KCSP_AUTH_MODE: demo
      KCSP_REQUIRE_REGISTERED_COLLECTORS: "true"
      KCSP_DEMO_SEED: "false"
      KCSP_DEFAULT_TENANT_ID: university-kulazhanov
      KCSP_DEFAULT_TENANT_NAME: K. Kulazhanov University
      KCSP_DATABASE_URL: postgres://kcsp:${KCSP_POSTGRES_PASSWORD}@postgres:5432/kcsp?sslmode=disable
      KCSP_CLICKHOUSE_URL: clickhouse://kcsp:${KCSP_CLICKHOUSE_PASSWORD}@clickhouse:9000/kcsp
      KCSP_KAFKA_BROKERS: kafka:9092
      KCSP_KAFKA_RAW_TOPIC: kcsp.raw.events.v1
      KCSP_KAFKA_DLQ_TOPIC: kcsp.raw.events.dlq.v1
      KCSP_KAFKA_ENVELOPE_HMAC_KEY: ${KCSP_KAFKA_ENVELOPE_HMAC_KEY:-kcsp-development-envelope-hmac-key-only}
      KCSP_LICENSE_TRUSTED_KEYS_JSON: ${KCSP_LICENSE_TRUSTED_KEYS_JSON:-}
      KCSP_KAFKA_PARTITIONS: 12
      KCSP_KAFKA_REPLICATION_FACTOR: 1
      KCSP_MINIO_ENDPOINT: minio:9000
      KCSP_MINIO_ACCESS_KEY: ${KCSP_MINIO_ROOT_USER}
      KCSP_MINIO_SECRET_KEY: ${KCSP_MINIO_ROOT_PASSWORD}
      KCSP_MINIO_EVIDENCE_BUCKET: kcsp-evidence
      KCSP_MINIO_REGION: us-east-1
      KCSP_MINIO_SECURE: "false"
      KCSP_EVIDENCE_MAX_BYTES: 104857600
      KCSP_VERSION: ${KCSP_VERSION:-development}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  processor:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["/usr/local/bin/kcsp-processor"]
    environment:
      KCSP_DEFAULT_TENANT_ID: university-kulazhanov
      KCSP_DEFAULT_TENANT_NAME: K. Kulazhanov University
      KCSP_DATABASE_URL: postgres://kcsp:${KCSP_POSTGRES_PASSWORD}@postgres:5432/kcsp?sslmode=disable
      KCSP_CLICKHOUSE_URL: clickhouse://kcsp:${KCSP_CLICKHOUSE_PASSWORD}@clickhouse:9000/kcsp
      KCSP_KAFKA_BROKERS: kafka:9092
      KCSP_KAFKA_RAW_TOPIC: kcsp.raw.events.v1
      KCSP_KAFKA_DLQ_TOPIC: kcsp.raw.events.dlq.v1
      KCSP_KAFKA_ENVELOPE_HMAC_KEY: ${KCSP_KAFKA_ENVELOPE_HMAC_KEY:-kcsp-development-envelope-hmac-key-only}
      KCSP_KAFKA_CONSUMER_GROUP: kcsp-canonical-processing-v1
      KCSP_KAFKA_PARTITIONS: 12
      KCSP_KAFKA_REPLICATION_FACTOR: 1
      KCSP_METRICS_ADDR: ":9090"
      KCSP_VERSION: ${KCSP_VERSION:-development}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  collector:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["/usr/local/bin/kcsp-collector"]
    environment:
      KCSP_COLLECTOR_SERVER_URL: http://api:8080
      KCSP_COLLECTOR_TENANT_ID: university-kulazhanov
      KCSP_COLLECTOR_ACCESS_TOKEN: kcsp-demo-collector
      KCSP_COLLECTOR_ALLOW_INSECURE_HTTP: "true"
      KCSP_COLLECTOR_SYSLOG_UDP_ADDR: ":5514"
      KCSP_COLLECTOR_SYSLOG_TCP_ADDR: ":5514"
      KCSP_COLLECTOR_HTTP_ADDR: ":8082"
      KCSP_COLLECTOR_HTTP_TOKEN: ${KCSP_COLLECTOR_HTTP_TOKEN:?Set KCSP_COLLECTOR_HTTP_TOKEN in .env}
      KCSP_COLLECTOR_HTTP_ALLOW_INSECURE: "true"
      KCSP_COLLECTOR_HEALTH_ADDR: ":8081"
      KCSP_COLLECTOR_STATE_DIR: /var/lib/kcsp-collector
      KCSP_COLLECTOR_QUEUE_MAX_BYTES: 1073741824
      KCSP_COLLECTOR_MAX_EVENT_BYTES: 1048576
      KCSP_COLLECTOR_EVENT_BUFFER: 4096
      KCSP_COLLECTOR_BATCH_SIZE: 200
      KCSP_COLLECTOR_FLUSH_INTERVAL: 250ms
      KCSP_COLLECTOR_HEARTBEAT_INTERVAL: 30s
    ports:
      - "127.0.0.1:5514:5514/tcp"
      - "127.0.0.1:5514:5514/udp"
      - "127.0.0.1:8082:8082/tcp"
    volumes:
      - kcsp-collector-state:/var/lib/kcsp-collector
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  soar-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["/usr/local/bin/kcsp-soar-worker"]
    environment:
      KCSP_DATABASE_URL: postgres://kcsp:${KCSP_POSTGRES_PASSWORD}@postgres:5432/kcsp?sslmode=disable
      KCSP_SOAR_WORKER_ID: kcsp-soar-worker-1
      KCSP_SOAR_POLL_INTERVAL: 500ms
      KCSP_SOAR_LEASE_DURATION: 30s
      KCSP_METRICS_ADDR: ":9091"
      KCSP_VERSION: ${KCSP_VERSION:-development}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["/usr/local/bin/kcsp-ai-worker"]
    environment:
      KCSP_DATABASE_URL: postgres://kcsp:${KCSP_POSTGRES_PASSWORD}@postgres:5432/kcsp?sslmode=disable
      KCSP_CLICKHOUSE_URL: clickhouse://kcsp:${KCSP_CLICKHOUSE_PASSWORD}@clickhouse:9000/kcsp
      KCSP_AI_WORKER_ID: kcsp-ai-worker-1
      KCSP_AI_POLL_INTERVAL: 500ms
      KCSP_AI_LEASE_DURATION: 90s
      KCSP_AI_LOCAL_MODEL: ${KCSP_AI_LOCAL_MODEL:-kcsp-grounded-rules-v1}
      KCSP_AI_LOCAL_ENDPOINT: ${KCSP_AI_LOCAL_ENDPOINT:-}
      KCSP_AI_LOCAL_API_KEY: ${KCSP_AI_LOCAL_API_KEY:-}
      KCSP_AI_CLOUD_MODEL: ${KCSP_AI_CLOUD_MODEL:-}
      KCSP_AI_CLOUD_ENDPOINT: ${KCSP_AI_CLOUD_ENDPOINT:-}
      KCSP_AI_CLOUD_API_KEY: ${KCSP_AI_CLOUD_API_KEY:-}
      KCSP_METRICS_ADDR: ":9092"
      KCSP_VERSION: ${KCSP_VERSION:-development}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - kcsp-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
      processor:
        condition: service_started
      soar-worker:
        condition: service_started
      ai-worker:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${KCSP_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${KCSP_GRAFANA_ADMIN_PASSWORD:?Set KCSP_GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - kcsp-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backup-store:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["dr", "dr-scheduled", "pitr"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${KCSP_DR_TARGET_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${KCSP_DR_TARGET_SECRET_KEY:-}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - kcsp-dr-target-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  pitr-s3-proxy:
    build:
      context: .
      dockerfile: Dockerfile.pitr-proxy
    profiles: ["pitr"]
    user: "101:101"
    depends_on:
      backup-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://127.0.0.1:9443/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs:
      - /run/kcsp-pitr:uid=101,gid=101,mode=0700
      - /tmp:uid=101,gid=101,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  pitr-drill:
    image: kcsp-postgres:17
    build:
      context: .
      dockerfile: Dockerfile.postgres
    profiles: ["pitr"]
    entrypoint: ["/usr/local/bin/kcsp-pitr-restore-drill"]
    environment:
      KCSP_PITR_ENABLED: "true"
      KCSP_PITR_STANZA: kcsp
      KCSP_PITR_TARGET_NAME: ${KCSP_PITR_TARGET_NAME:-}
      KCSP_PITR_VERIFY_DATABASE: kcsp
      KCSP_PITR_RTO_SECONDS: ${KCSP_PITR_RTO_SECONDS:-3600}
      KCSP_PITR_S3_ENDPOINT: ${KCSP_PITR_S3_ENDPOINT:-}
      KCSP_PITR_S3_PORT: ${KCSP_PITR_S3_PORT:-443}
      KCSP_PITR_S3_BUCKET: ${KCSP_PITR_S3_BUCKET:-kcsp-dr}
      KCSP_PITR_S3_REGION: ${KCSP_PITR_S3_REGION:-us-east-1}
      KCSP_PITR_TLS_VERIFY: ${KCSP_PITR_TLS_VERIFY:-y}
      KCSP_PITR_REPO_PATH: ${KCSP_PITR_REPO_PATH:-/pgbackrest}
      PGBACKREST_REPO1_S3_KEY: ${KCSP_PITR_S3_ACCESS_KEY:-}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${KCSP_PITR_S3_SECRET_KEY:-}
      PGBACKREST_REPO1_CIPHER_PASS: ${KCSP_PITR_REPO_CIPHER_PASS:-}
      POSTGRES_USER: kcsp
      PGDATA: /var/lib/postgresql/pitr-primary-reference
    user: "70:70"
    volumes:
      - kcsp-pitr-drill-data:/var/lib/postgresql/pitr-drill
      - kcsp-pgbackrest-state:/var/lib/pgbackrest
    depends_on:
      pitr-s3-proxy:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:uid=70,gid=70,mode=1770
      - /etc/pgbackrest:uid=70,gid=70,mode=0700
      - /var/log/pgbackrest:uid=70,gid=70,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  etcd-1:
    image: gcr.io/etcd-development/etcd:v3.5.21
    profiles: ["ha"]
    entrypoint: ["/usr/local/bin/etcd"]
    command:
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=kcsp-ha-etcd-v1
      - --auto-compaction-retention=1h
      - --auto-compaction-mode=periodic
    environment:
      ETCDCTL_API: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - kcsp-etcd-1-data:/etcd-data
    networks:
      - kcsp-ha-dcs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  etcd-2:
    image: gcr.io/etcd-development/etcd:v3.5.21
    profiles: ["ha"]
    entrypoint: ["/usr/local/bin/etcd"]
    command:
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=kcsp-ha-etcd-v1
      - --auto-compaction-retention=1h
      - --auto-compaction-mode=periodic
    environment:
      ETCDCTL_API: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - kcsp-etcd-2-data:/etcd-data
    networks:
      - kcsp-ha-dcs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  etcd-3:
    image: gcr.io/etcd-development/etcd:v3.5.21
    profiles: ["ha"]
    entrypoint: ["/usr/local/bin/etcd"]
    command:
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-3:2379
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=kcsp-ha-etcd-v1
      - --auto-compaction-retention=1h
      - --auto-compaction-mode=periodic
    environment:
      ETCDCTL_API: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - kcsp-etcd-3-data:/etcd-data
    networks:
      - kcsp-ha-dcs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  patroni-1:
    image: kcsp-patroni:4.1.5-pg17
    build:
      context: .
      dockerfile: Dockerfile.patroni
    profiles: ["ha"]
    environment:
      <<: *patroni-environment
      KCSP_PATRONI_NAME: patroni-1
    depends_on: *patroni-dependencies
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    volumes:
      - kcsp-patroni-1-data:/var/lib/postgresql/data
    networks:
      - kcsp-ha-data
      - kcsp-ha-dcs
    read_only: true
    tmpfs:
      - /tmp:uid=70,gid=70,mode=0700
      - /var/run/postgresql:uid=70,gid=70,mode=0770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  patroni-2:
    image: kcsp-patroni:4.1.5-pg17
    build:
      context: .
      dockerfile: Dockerfile.patroni
    profiles: ["ha"]
    environment:
      <<: *patroni-environment
      KCSP_PATRONI_NAME: patroni-2
    depends_on: *patroni-dependencies
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    volumes:
      - kcsp-patroni-2-data:/var/lib/postgresql/data
    networks:
      - kcsp-ha-data
      - kcsp-ha-dcs
    read_only: true
    tmpfs:
      - /tmp:uid=70,gid=70,mode=0700
      - /var/run/postgresql:uid=70,gid=70,mode=0770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  patroni-3:
    image: kcsp-patroni:4.1.5-pg17
    build:
      context: .
      dockerfile: Dockerfile.patroni
    profiles: ["ha"]
    environment:
      <<: *patroni-environment
      KCSP_PATRONI_NAME: patroni-3
    depends_on: *patroni-dependencies
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    volumes:
      - kcsp-patroni-3-data:/var/lib/postgresql/data
    networks:
      - kcsp-ha-data
      - kcsp-ha-dcs
    read_only: true
    tmpfs:
      - /tmp:uid=70,gid=70,mode=0700
      - /var/run/postgresql:uid=70,gid=70,mode=0770
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres-ha:
    image: kcsp-postgres-ha-router:3.2
    build:
      context: .
      dockerfile: Dockerfile.haproxy
    profiles: ["ha"]
    depends_on:
      patroni-1:
        condition: service_started
      patroni-2:
        condition: service_started
      patroni-3:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:5434:5432"
      - "127.0.0.1:5435:5433"
      - "127.0.0.1:8404:7000"
    networks:
      - kcsp-ha-data
      - kcsp-ha-ingress
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  dr:
    build:
      context: .
      dockerfile: Dockerfile.dr
    profiles: ["dr"]
    command: ["backup"]
    environment: &dr-environment
      KCSP_DR_POSTGRES_HOST: postgres
      KCSP_DR_POSTGRES_PORT: 5432
      KCSP_DR_POSTGRES_USER: kcsp
      KCSP_DR_POSTGRES_PASSWORD: ${KCSP_POSTGRES_PASSWORD}
      KCSP_DR_POSTGRES_DATABASE: kcsp
      KCSP_DR_CLICKHOUSE_HOST: clickhouse
      KCSP_DR_CLICKHOUSE_PORT: 9000
      KCSP_DR_CLICKHOUSE_USER: kcsp
      KCSP_DR_CLICKHOUSE_PASSWORD: ${KCSP_CLICKHOUSE_PASSWORD}
      KCSP_DR_CLICKHOUSE_DATABASE: kcsp
      KCSP_DR_CLICKHOUSE_BACKUP_DISK: backups
      KCSP_DR_SOURCE_S3_ENDPOINT: http://minio:9000
      KCSP_DR_SOURCE_S3_ACCESS_KEY: ${KCSP_MINIO_ROOT_USER}
      KCSP_DR_SOURCE_S3_SECRET_KEY: ${KCSP_MINIO_ROOT_PASSWORD}
      KCSP_DR_SOURCE_S3_BUCKET: kcsp-evidence
      KCSP_DR_SOURCE_ALLOW_INSECURE: "true"
      KCSP_DR_TARGET_S3_ENDPOINT: ${KCSP_DR_TARGET_ENDPOINT:-http://backup-store:9000}
      KCSP_DR_TARGET_S3_ACCESS_KEY: ${KCSP_DR_TARGET_ACCESS_KEY:-}
      KCSP_DR_TARGET_S3_SECRET_KEY: ${KCSP_DR_TARGET_SECRET_KEY:-}
      KCSP_DR_TARGET_S3_BUCKET: ${KCSP_DR_TARGET_BUCKET:-kcsp-dr}
      KCSP_DR_TARGET_ALLOW_INSECURE: ${KCSP_DR_TARGET_ALLOW_INSECURE:-false}
      KCSP_DR_MANIFEST_HMAC_KEY: ${KCSP_DR_MANIFEST_HMAC_KEY:-}
      KCSP_DR_RPO_SECONDS: ${KCSP_DR_RPO_SECONDS:-86400}
      KCSP_DR_RTO_SECONDS: ${KCSP_DR_RTO_SECONDS:-3600}
      KCSP_DR_SCHEDULE_SECONDS: ${KCSP_DR_SCHEDULE_SECONDS:-21600}
      KCSP_DR_RETENTION_DAYS: ${KCSP_DR_RETENTION_DAYS:-30}
      KCSP_DR_MINIMUM_BACKUPS: ${KCSP_DR_MINIMUM_BACKUPS:-7}
      KCSP_DR_COMMAND_TIMEOUT_SECONDS: ${KCSP_DR_COMMAND_TIMEOUT_SECONDS:-86400}
      KCSP_DR_WORK_DIR: /var/lib/kcsp/dr
      KCSP_DR_CLICKHOUSE_BACKUP_DIR: /var/lib/kcsp/clickhouse-backups
      KCSP_DR_CONFIG_ROOT: /workspace
      KCSP_VERSION: ${KCSP_VERSION:-development}
    volumes: &dr-volumes
      - .:/workspace:ro
      - kcsp-dr-work:/var/lib/kcsp/dr
      - kcsp-clickhouse-backups:/var/lib/kcsp/clickhouse-backups
    depends_on: &dr-dependencies
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      backup-store:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  dr-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dr
    profiles: ["dr-scheduled"]
    command: ["schedule"]
    environment: *dr-environment
    volumes: *dr-volumes
    depends_on: *dr-dependencies
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        KCSP_WEB_MODE: demo
        KCSP_WEB_TENANT: university-kulazhanov
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  kcsp-postgres-data:
  kcsp-pgbackrest-state:
  kcsp-pitr-drill-data:
  kcsp-etcd-1-data:
  kcsp-etcd-2-data:
  kcsp-etcd-3-data:
  kcsp-patroni-1-data:
  kcsp-patroni-2-data:
  kcsp-patroni-3-data:
  kcsp-kafka-data:
  kcsp-clickhouse-data:
  kcsp-clickhouse-logs:
  kcsp-clickhouse-backups:
  kcsp-minio-data:
  kcsp-collector-state:
  kcsp-prometheus-data:
  kcsp-grafana-data:
  kcsp-dr-target-data:
  kcsp-dr-work:

networks:
  kcsp-ha-ingress:
    name: kcsp-ha-ingress
  kcsp-ha-data:
    name: kcsp-ha-data
    internal: true
  kcsp-ha-dcs:
    name: kcsp-ha-dcs
    internal: true
