name: kcsp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kcsp
      POSTGRES_USER: kcsp
      POSTGRES_PASSWORD: ${KCSP_POSTGRES_PASSWORD:?Set KCSP_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcsp -d kcsp"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - kcsp-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - kcsp-kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: kcsp
      CLICKHOUSE_USER: kcsp
      CLICKHOUSE_PASSWORD: ${KCSP_CLICKHOUSE_PASSWORD:?Set KCSP_CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - kcsp-clickhouse-data:/var/lib/clickhouse
      - kcsp-clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${KCSP_MINIO_ROOT_USER:?Set KCSP_MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${KCSP_MINIO_ROOT_PASSWORD:?Set KCSP_MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - kcsp-minio-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      KCSP_LISTEN_ADDR: ":8080"
      KCSP_PROFILE: development
      KCSP_AUTH_MODE: demo
      KCSP_REQUIRE_REGISTERED_COLLECTORS: "true"
      KCSP_DEMO_SEED: "false"
      KCSP_DEFAULT_TENANT_ID: university-kulazhanov
      KCSP_DEFAULT_TENANT_NAME: K. Kulazhanov University
      KCSP_DATABASE_URL: postgres://kcsp:${KCSP_POSTGRES_PASSWORD}@postgres:5432/kcsp?sslmode=disable
      KCSP_CLICKHOUSE_URL: clickhouse://kcsp:${KCSP_CLICKHOUSE_PASSWORD}@clickhouse:9000/kcsp
      KCSP_KAFKA_BROKERS: kafka:9092
      KCSP_KAFKA_RAW_TOPIC: kcsp.raw.events.v1
      KCSP_KAFKA_DLQ_TOPIC: kcsp.raw.events.dlq.v1
      KCSP_KAFKA_PARTITIONS: 12
      KCSP_KAFKA_REPLICATION_FACTOR: 1
      KCSP_MINIO_ENDPOINT: minio:9000
      KCSP_MINIO_ACCESS_KEY: ${KCSP_MINIO_ROOT_USER}
      KCSP_MINIO_SECRET_KEY: ${KCSP_MINIO_ROOT_PASSWORD}
      KCSP_MINIO_EVIDENCE_BUCKET: kcsp-evidence
      KCSP_MINIO_REGION: us-east-1
      KCSP_MINIO_SECURE: "false"
      KCSP_EVIDENCE_MAX_BYTES: 104857600
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  processor:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["/usr/local/bin/kcsp-processor"]
    environment:
      KCSP_DEFAULT_TENANT_ID: university-kulazhanov
      KCSP_DEFAULT_TENANT_NAME: K. Kulazhanov University
      KCSP_DATABASE_URL: postgres://kcsp:${KCSP_POSTGRES_PASSWORD}@postgres:5432/kcsp?sslmode=disable
      KCSP_CLICKHOUSE_URL: clickhouse://kcsp:${KCSP_CLICKHOUSE_PASSWORD}@clickhouse:9000/kcsp
      KCSP_KAFKA_BROKERS: kafka:9092
      KCSP_KAFKA_RAW_TOPIC: kcsp.raw.events.v1
      KCSP_KAFKA_DLQ_TOPIC: kcsp.raw.events.dlq.v1
      KCSP_KAFKA_CONSUMER_GROUP: kcsp-canonical-processing-v1
      KCSP_KAFKA_PARTITIONS: 12
      KCSP_KAFKA_REPLICATION_FACTOR: 1
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_AUTH_MODE: demo
        VITE_API_TOKEN: kcsp-demo-l2
        VITE_TENANT_ID: university-kulazhanov
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  kcsp-postgres-data:
  kcsp-kafka-data:
  kcsp-clickhouse-data:
  kcsp-clickhouse-logs:
  kcsp-minio-data:
