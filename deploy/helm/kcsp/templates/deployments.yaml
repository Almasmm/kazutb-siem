{{- $root := . -}}
{{- range $name, $workload := .Values.workloads }}
{{- if $workload.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kcsp.fullname" $root }}-{{ $name }}
  labels:
    {{- include "kcsp.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not $workload.autoscaling.enabled }}
  replicas: {{ $workload.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  {{- if eq $name "collector" }}
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "kcsp.componentLabels" (dict "root" $root "component" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kcsp.componentLabels" (dict "root" $root "component" $name) | nindent 8 }}
        {{- with $root.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        {{- with $root.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kcsp.serviceAccountName" $root }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $workload.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $root.Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ $root.Values.topologySpread.maxSkew }}
          topologyKey: {{ $root.Values.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ $root.Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "kcsp.componentLabels" (dict "root" $root "component" $name) | nindent 14 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "kcsp.image" (dict "root" $root "component" $name) | quote }}
          imagePullPolicy: {{ (index $root.Values.images $name).pullPolicy }}
          {{- with $workload.command }}
          command: {{ toJson . }}
          {{- end }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          ports:
            {{- if eq $name "collector" }}
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if $root.Values.config.networkCollector.syslog.udpAddress }}
            - name: syslog-udp
              containerPort: {{ $root.Values.config.networkCollector.service.udpPort }}
              protocol: UDP
            {{- end }}
            {{- if $root.Values.config.networkCollector.syslog.tcpAddress }}
            - name: syslog-tcp
              containerPort: {{ $root.Values.config.networkCollector.service.tcpPort }}
              protocol: TCP
            {{- end }}
            {{- if $root.Values.config.networkCollector.syslog.tlsAddress }}
            - name: syslog-tls
              containerPort: {{ $root.Values.config.networkCollector.service.tlsPort }}
              protocol: TCP
            {{- end }}
            {{- if $root.Values.config.networkCollector.http.enabled }}
            - name: http-json
              containerPort: {{ $root.Values.config.networkCollector.service.httpPort }}
              protocol: TCP
            {{- end }}
            {{- else }}
            - name: {{ $workload.portName }}
              containerPort: {{ $workload.containerPort }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "kcsp.fullname" $root }}-config
            {{- if and (eq $name "soar-worker") $root.Values.secrets.connectorExistingSecret }}
            - secretRef:
                name: {{ $root.Values.secrets.connectorExistingSecret }}
            {{- end }}
          env:
            {{- if or (eq $name "api") (eq $name "processor") (eq $name "soar-worker") (eq $name "ai-worker") }}
            - name: KCSP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.existingSecret is required" $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.keys.databaseURL }}
            {{- end }}
            {{- if or (eq $name "api") (eq $name "processor") (eq $name "ai-worker") }}
            - name: KCSP_CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.keys.clickhouseURL }}
            {{- end }}
            {{- if or (eq $name "api") (eq $name "processor") }}
            - name: KCSP_KAFKA_ENVELOPE_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.keys.kafkaEnvelopeHMACKey }}
            {{- end }}
            {{- if eq $name "api" }}
            - name: KCSP_LISTEN_ADDR
              value: ":8080"
            - name: KCSP_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.keys.minioAccessKey }}
            - name: KCSP_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.keys.minioSecretKey }}
            - name: KCSP_VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.keys.valkeyURL }}
            - name: KCSP_VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.keys.valkeyPassword }}
            {{- end }}
            {{- if eq $name "collector" }}
            - name: KCSP_COLLECTOR_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.keys.collectorOAuthClientID }}
            - name: KCSP_COLLECTOR_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.keys.collectorOAuthClientSecret }}
            {{- if $root.Values.trustBundle.existingConfigMap }}
            - name: KCSP_COLLECTOR_UPSTREAM_CA_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            {{- end }}
            {{- end }}
            {{- if or (eq $name "processor") (eq $name "soar-worker") (eq $name "ai-worker") }}
            - name: KCSP_METRICS_ADDR
              value: ":9090"
            {{- end }}
            {{- if eq $name "soar-worker" }}
            - name: KCSP_SOAR_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- if eq $name "ai-worker" }}
            - name: KCSP_AI_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KCSP_AI_LOCAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.keys.aiLocalAPIKey }}
                  optional: true
            - name: KCSP_AI_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.existingSecret }}
                  key: {{ $root.Values.secrets.keys.aiCloudAPIKey }}
                  optional: true
            {{- end }}
          {{- with $workload.probes.startup }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $workload.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $workload.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $name "collector" }}
            - name: collector-state
              mountPath: /var/lib/kcsp-collector
            {{- if $root.Values.config.networkCollector.tls.existingSecret }}
            - name: collector-syslog-tls
              mountPath: /etc/kcsp/syslog-tls
              readOnly: true
            {{- end }}
            {{- with $root.Values.config.networkCollector.fileTail.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- if eq $name "web" }}
            - name: web-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: web-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            {{- end }}
            {{- if and (ne $name "web") $root.Values.trustBundle.existingConfigMap }}
            - name: trust-bundle
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: {{ $root.Values.trustBundle.key }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ $root.Values.ephemeralStorage.tmpSizeLimit }}
        {{- if eq $name "collector" }}
        - name: collector-state
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-collector" (include "kcsp.fullname" $root)) $root.Values.config.networkCollector.storage.existingClaim }}
        {{- if $root.Values.config.networkCollector.tls.existingSecret }}
        - name: collector-syslog-tls
          secret:
            secretName: {{ $root.Values.config.networkCollector.tls.existingSecret }}
            items:
              - key: {{ $root.Values.config.networkCollector.tls.certificateKey }}
                path: tls.crt
              - key: {{ $root.Values.config.networkCollector.tls.privateKeyKey }}
                path: tls.key
              - key: {{ $root.Values.config.networkCollector.tls.clientCAKey }}
                path: ca.crt
        {{- end }}
        {{- with $root.Values.config.networkCollector.fileTail.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if eq $name "web" }}
        - name: web-config
          configMap:
            name: {{ include "kcsp.fullname" $root }}-web
        - name: nginx-cache
          emptyDir:
            sizeLimit: {{ $root.Values.ephemeralStorage.nginxCacheSizeLimit }}
        {{- end }}
        {{- if and (ne $name "web") $root.Values.trustBundle.existingConfigMap }}
        - name: trust-bundle
          configMap:
            name: {{ $root.Values.trustBundle.existingConfigMap }}
            items:
              - key: {{ $root.Values.trustBundle.key }}
                path: {{ $root.Values.trustBundle.key }}
        {{- end }}
{{- end }}
{{- end }}
