{{- if .Values.observability.serviceMonitor.enabled }}
{{- $root := . -}}
{{- range $name, $workload := .Values.workloads }}
{{- if and $workload.enabled $workload.service.enabled $workload.service.monitor }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kcsp.fullname" $root }}-{{ $name }}
  labels:
    {{- include "kcsp.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    {{- with $root.Values.observability.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kcsp.componentLabels" (dict "root" $root "component" $name) | nindent 6 }}
  endpoints:
    - port: {{ $workload.portName }}
      path: /metrics
      scheme: http
      interval: {{ $root.Values.observability.serviceMonitor.interval }}
      scrapeTimeout: {{ $root.Values.observability.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}
{{- end }}
